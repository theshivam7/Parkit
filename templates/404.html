{% extends "base.html" %}

{% block title %}404 Not Found{% endblock %}

{% block content %}
<main class="container py-5 text-center" role="main">
    <div class="error-content">
        <h1 class="display-4 text-primary fw-bold mb-3" aria-label="Error 404">404</h1>
        <h2 class="h4 mb-4">Page Not Found</h2>
        <p class="lead mb-4">
            Sorry, the page you are looking for does not exist.
        </p>
        <a href="{{ url_for('index') }}" 
           class="btn btn-primary mt-3"
           role="button"
           aria-label="Return to homepage">
            <i class="bi bi-house me-2" aria-hidden="true"></i>Back to Home
        </a>
    </div>
</main>
{% endblock %}
